<!doctype html><html lang="en" data-theme="heritage" data-culture-theme="aipan"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d09"><title>Wildlife Watch · almora.ai</title><link rel="stylesheet" href="./src/styles/design-system.css?v=6"><link rel="stylesheet" href="./src/styles/aipan.css?v=6"><link rel="stylesheet" href="./src/styles/experience.css?v=3"><style>.wrap{max-width:1280px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top a{text-decoration:none}.langs,.tabs{display:flex;gap:6px;flex-wrap:wrap}.langs button,.tabs button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:8px 11px;cursor:pointer}.langs .active,.tabs .active{background:var(--green);color:#0b100c}.hero{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;min-height:380px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel)}.heroText{padding:34px}.hero h1{font-size:clamp(38px,5vw,72px);line-height:.95;margin:8px 0}.hero p{color:var(--muted);line-height:1.6}.heroArt{background:linear-gradient(180deg,transparent,rgba(0,0,0,.28)),url('./assets/generated/ai-monkey-kumaon.svg') center/cover no-repeat;min-height:340px}.note{margin-top:14px;padding:12px;border:1px solid #8f5e2f;border-radius:14px;background:#2a1b0e}.tabs{margin:16px 0}.card{border:1px solid var(--line);border-radius:22px;padding:18px;background:var(--panel)}.speciesHead{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.speciesPic{height:150px;border-radius:18px;background:linear-gradient(135deg,#54261b,#17221b);display:grid;place-items:center;font-size:72px;overflow:hidden}.speciesPic img{width:100%;height:100%;object-fit:cover}.speciesHead h2{margin:0 0 4px}.latin{color:var(--muted);font-style:italic}.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}.fact{border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:13px}.fact h3{margin:0 0 7px;font-size:13px}.fact p,.fact li{font-size:11px;line-height:1.55;color:var(--muted)}.fact ul{padding-left:18px;margin:0}.report{margin-top:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px}.reportGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.report input,.report textarea,.report select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px}.report button{border:0;background:var(--green);color:#0b100c;border-radius:10px;padding:11px 14px;font-weight:800}.sources{margin-top:16px;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--panel)}.sources a{color:var(--green)}@media(max-width:850px){.hero{grid-template-columns:1fr}.heroArt{min-height:420px;order:-1}.facts{grid-template-columns:1fr}.speciesHead{grid-template-columns:100px 1fr}.speciesPic{height:100px}.reportGrid{grid-template-columns:1fr}.wrap{padding:14px 12px 58px}}</style></head><body><main class="wrap"><header class="top"><a href="./index.html#home">← <strong>almora.ai</strong></a><div class="langs"><button data-lang="en">EN</button><button data-lang="hi">हिंदी</button><button data-lang="kfy">कुमाऊँनी</button></div></header><section class="hero"><div class="heroText"><small>WILDLIFE WATCH</small><h1 id="title"></h1><p id="intro"></p><div class="note" id="safety"></div></div><div class="heroArt" role="img" aria-label="AI-generated representative rhesus macaques in a Kumaon hill setting"></div></section><nav class="tabs" id="tabs"></nav><section class="card" id="card"></section><section class="report"><h2 id="reportTitle"></h2><p id="reportNote"></p><form id="reportForm"><div class="reportGrid"><label><span id="speciesLabel"></span><select id="speciesSelect"></select></label><label><span id="locationLabel"></span><input id="location" required></label></div><label><span id="detailsLabel"></span><textarea id="details" rows="4" required></textarea></label><button type="submit" id="save"></button><p id="status" aria-live="polite"></p></form></section><section class="sources"><h2 id="sourcesTitle"></h2><p><a href="https://wii.gov.in/index.php/population-management-capture-and-rehabilitation" target="_blank" rel="noopener">Wildlife Institute of India · conflict mitigation, capture and rehabilitation</a></p><p><a href="https://www.indiacode.nic.in/handle/123456789/1726" target="_blank" rel="noopener">India Code · Wild Life (Protection) Act, 1972</a></p><p id="legalNote"></p></section></main><script type="module">import{submitTownReport}from'./src/scripts/report-service.js';const T={en:{title:'Human–wildlife coexistence',intro:'Biology, practical conflict prevention and moderated reporting for common human–wildlife encounters around Almora. This tool does not diagnose animal behaviour or order capture, relocation, sterilisation, hunting or killing.',safety:'If an animal is close, trapped, injured, attacking or causing immediate danger: keep people and pets away, provide an escape route, and contact authorised Forest Department / emergency services. Do not feed, corner, chase, poison, trap or handle wildlife yourself.',report:'Report a sighting or conflict',reportNote:'Community reports are unverified signals until reviewed. Do not use them as a live danger map.',species:'Species',location:'Area / landmark',details:'What happened?',save:'Save for review',saved:'Saved for moderated review.',sources:'Official and scientific sources',legal:'Legal status: these wild animals are governed by India’s Wild Life (Protection) Act and related rules/orders. Exact schedules, permissions and local control orders can change; check current India Code and the authorised Forest Department before any intervention.'},hi:{title:'मानव–वन्यजीव सह-अस्तित्व',intro:'अल्मोड़ा क्षेत्र में मिलने वाले वन्यजीवों के लिए जीवविज्ञान, व्यावहारिक संघर्ष-रोकथाम और मॉडरेटेड रिपोर्टिंग। यह उपकरण व्यवहार का निदान या पकड़ने, स्थानांतरण, नसबंदी, शिकार या मारने का आदेश नहीं देता।',safety:'यदि जानवर पास, घायल, फँसा, हमला कर रहा हो या तत्काल खतरा हो: लोगों और पालतू पशुओं को दूर रखें, निकलने का रास्ता दें और अधिकृत वन विभाग / आपात सेवा से संपर्क करें। स्वयं भोजन, घेराव, पीछा, ज़हर, फंदा या पकड़ न करें।',report:'दिखाई देने या संघर्ष की रिपोर्ट',reportNote:'सामुदायिक रिपोर्ट समीक्षा से पहले अपुष्ट संकेत हैं; इन्हें लाइव खतरे का नक्शा न मानें।',species:'प्रजाति',location:'क्षेत्र / पहचान',details:'क्या हुआ?',save:'समीक्षा के लिए सेव करें',saved:'मॉडरेटेड समीक्षा के लिए सेव हुआ।',sources:'आधिकारिक और वैज्ञानिक स्रोत',legal:'कानूनी स्थिति: ये जंगली जानवर भारत के वन्य जीव (संरक्षण) अधिनियम और संबंधित नियम/आदेशों के अधीन हैं। अनुसूची, अनुमति और स्थानीय नियंत्रण आदेश बदल सकते हैं; किसी हस्तक्षेप से पहले वर्तमान India Code और अधिकृत वन विभाग से पुष्टि करें।'},kfy:{title:'मानव अर जंगली जानवर सह-जीवन',intro:'अल्माड़ आसपास मिलण वाला जंगली जानवर खातिर जीव-विज्ञान, टकराव घटाण का उपाय अर समीक्षा वाली रिपोर्टिंग। यो औजार जानवर को फैसला या पकड़, ठौर बदलण, नसबंदी, शिकार या मारण को आदेश नि दिंछ।',safety:'जानवर नजदीक, घायल, फंसल या तुरन्त खतरो छ त लोग अर पालतू जानवर दूर राखौ, निकलण को बाट छोड़ौ अर अधिकृत वन विभाग / आपत सेवा स्यूं संपर्क करौ। खुद खाना, घेरण, दौड़ाण, जहर, फंदो या पकड़ मत करौ।',report:'दिखाई/टकराव रिपोर्ट करौ',reportNote:'सामुदायिक रिपोर्ट समीक्षा पैल अपुष्ट संकेत छन; इन्हें लाइव खतरा नक्शा मत मानौ।',species:'जानवर',location:'ठौर / निशान',details:'कै भै?',save:'समीक्षा खातिर बचौ',saved:'समीक्षा खातिर बचि ग्यो।',sources:'सरकारी अर वैज्ञानिक स्रोत',legal:'कानूनी स्थिति: यी जंगली जानवर भारत का वन्य जीव संरक्षण कानून अर नियम/आदेश का अधीन छन। अनुसूची अर अनुमति बदल सकन; कछु कदम उठाण पैल India Code अर अधिकृत वन विभाग स्यूं जांच करौ।'}};const S={monkey:{icon:'🐒',img:'./assets/generated/ai-monkey-kumaon.svg',latin:'Macaca mulatta',name:{en:'Rhesus macaque',hi:'रीसस मकाक / बंदर',kfy:'रीसस मकाक / बंदर'},bio:{en:'Highly adaptable, social, day-active primate. Omnivorous; natural foods include fruit, seeds, leaves and invertebrates, while unsecured human food and waste can strongly reinforce town-raiding behaviour.',hi:'बहुत अनुकूलनशील, सामाजिक और दिन में सक्रिय प्राइमेट। फल, बीज, पत्तियाँ और छोटे जीव खाता है; खुला मानव भोजन व कचरा शहर में बार-बार आने की आदत बढ़ा सकता है।',kfy:'बहुत अनुकूल, झुंड में रौण अर दिन में सक्रिय प्राइमेट। फल, बीज, पात, कीड़ा खांछ; खुलो मानव खाना अर कूड़ शहर में बार-बार आण की आदत बढ़ा सकछ।'},avoid:{en:['Never hand-feed.','Use animal-resistant bins and close food stores.','Do not stare, grab young or block troop movement.','Coordinate neighbourhood waste control instead of individual capture.'],hi:['हाथ से भोजन न दें।','कचरा और भोजन बंद रखें।','घूरें नहीं, बच्चे न पकड़ें, रास्ता न रोकें।','व्यक्तिगत पकड़ने के बजाय सामुदायिक कचरा नियंत्रण करें।'],kfy:['हाथ स्यूं खाना नि दिओ।','कूड़ अर खाना बंद राखौ।','घूरौ नि, बच्चा नि पकड़ौ, बाट नि रोकौ।','खुद पकड़ण की बजाय मोहल्ला कूड़ नियंत्रण करौ।']}},leopard:{icon:'🐆',latin:'Panthera pardus',name:{en:'Leopard',hi:'तेंदुआ',kfy:'तेंदुवा'},bio:{en:'Solitary, mostly crepuscular/nocturnal large cat with exceptional adaptability. It can use forest edges, scrub, ravines and human-dominated landscapes where cover and prey are available.',hi:'अधिकतर अकेला और शाम/रात में सक्रिय बड़ा बिल्ली प्रजाति का शिकारी। जंगल किनारे, झाड़ियों, गधेरों और मानव-प्रधान क्षेत्रों में भी रह सकता है जहाँ आड़ और शिकार मिलता हो।',kfy:'ज्यादातर अकेल अर सांझ/रात में सक्रिय बड़ो बिल्ली शिकारी। जंगल किनार, झाड़ी, गधेरा अर आबादी नजदीक भी रह सकछ जां आड़ अर शिकार मिलो।'},avoid:{en:['Keep children close at dawn/dusk in known activity areas.','Use lighting around livestock sheds and secure small livestock at night.','Do not crowd or pursue a sighting.','Report repeated livestock attacks or bold daytime presence to Forest staff.'],hi:['ज्ञात क्षेत्र में सुबह/शाम बच्चों को पास रखें।','पशुशाला के पास रोशनी और रात में छोटे पशुओं की सुरक्षा करें।','दिखाई देने पर भीड़ या पीछा न करें।','बार-बार पशु हमला या दिन में निर्भीक उपस्थिति वन विभाग को बताएं।'],kfy:['जानकारी वाला ठौर में बिहान/सांझ बच्चा पास राखौ।','गोठ में रोशनी अर रात में छोट पशु सुरक्षित राखौ।','दिखे त भीड़/पीछो नि करौ।','बार-बार पशु हमला या दिन में निडर दिखण वन विभाग बतौ।']}},bear:{icon:'🐻',latin:'Ursus thibetanus',name:{en:'Asiatic black bear / Himalayan black bear',hi:'एशियाई काला भालू / हिमालयी काला भालू',kfy:'काळ भालू'},bio:{en:'Powerful omnivorous bear of Himalayan forests. Diet varies seasonally and can include fruits, nuts, vegetation, insects and crops; surprise encounters at close range can be dangerous.',hi:'हिमालयी जंगलों का शक्तिशाली सर्वाहारी भालू। मौसम के अनुसार फल, मेवे, वनस्पति, कीट और फसल खा सकता है; बहुत पास अचानक सामना खतरनाक हो सकता है।',kfy:'हिमालयी जंगल को ताकतवर सर्वाहारी भालू। मौसम मुताबिक फल, दाना, पात, कीड़ा अर फसल खांछ; एकदम नजदीक अचानक भेट खतरनाक हो सकछ।'},avoid:{en:['Make noise when walking through dense cover.','Do not approach cubs or a feeding bear.','Secure fruit waste, compost and livestock feed.','Back away slowly; never run toward or corner a bear.'],hi:['घनी झाड़ी में चलते समय आवाज़ करते रहें।','बच्चों या खाते भालू के पास न जाएँ।','फल-कचरा, खाद और पशु आहार बंद रखें।','धीरे पीछे हटें; भालू को घेरें या उसकी ओर न दौड़ें।'],kfy:['घणी झाड़ी में चालदा आवाज करौ।','बच्चा या खांण भालू नजदीक नि जौ।','फल-कूड़, खाद अर पशु खाना बंद राखौ।','धीरे पछिल हटौ; भालू घेरौ या उक तरफ दौड़ौ नि।']}},boar:{icon:'🐗',latin:'Sus scrofa',name:{en:'Wild boar',hi:'जंगली सूअर',kfy:'जंगली सुअर'},bio:{en:'Strong, intelligent omnivore using forest, scrub and farm edges. It roots soil for tubers and invertebrates and may raid crops, especially where attractive food is easy to access.',hi:'मजबूत और बुद्धिमान सर्वाहारी जो जंगल, झाड़ी और खेत किनारों में रहता है। कंद और छोटे जीव खोजने के लिए मिट्टी खोदता है और आसान भोजन मिलने पर फसल नुकसान कर सकता है।',kfy:'ताकतवर अर समझदार सर्वाहारी, जंगल-झाड़ी अर खेत किनार में रौछ। कंद-कीड़ा खातिर जमीन खोदछ अर आसान खाना मिल्या त फसल नुकसान कर सकछ।'},avoid:{en:['Avoid dense crop edges at night when activity is reported.','Use well-maintained lawful fencing where appropriate.','Remove fallen fruit and food waste near homes.','Do not chase or corner a wounded or defensive boar.'],hi:['रिपोर्ट होने पर रात में घने खेत किनारों से बचें।','जहाँ उचित हो कानूनी और सुरक्षित बाड़ रखें।','घर पास गिरे फल और खाद्य कचरा हटाएँ।','घायल या रक्षात्मक सूअर का पीछा/घेराव न करें।'],kfy:['रात में रिपोर्ट वाला घणा खेत किनार स्यूं बचौ।','जां ठीक हो सुरक्षित कानूनी बाड़ राखौ।','घर नजदीक गिरल फल अर खाना-कूड़ हटौ।','घायल/बचाव करन सुअर पीछो या घेरौ नि।']}},nilgai:{icon:'🦌',latin:'Boselaphus tragocamelus',name:{en:'Nilgai',hi:'नीलगाय',kfy:'नीलगाय'},bio:{en:'Large Asian antelope primarily associated with open woodland, scrub and agricultural mosaics. It browses and grazes and can enter cropland where food and open movement corridors are available.',hi:'बड़ी एशियाई मृग प्रजाति जो खुली झाड़ी, वन-किनारे और कृषि क्षेत्र में मिलती है। घास और पत्तियाँ खाती है और खुले मार्ग व भोजन मिलने पर खेतों में आ सकती है।',kfy:'बड़ एशियाई हिरन-जैस जानवर, खुली झाड़ी, जंगल किनार अर खेती वाला इलाक में मिलो। घास-पात खांछ अर खुलो बाट अर खाना मिल्या त खेत में आ सकछ।'},avoid:{en:['Do not crowd animals on roads or narrow paths.','Use crop-protection measures that do not injure wildlife.','Keep dogs from chasing animals.','Report persistent crop damage through authorised channels.'],hi:['सड़क या संकरे रास्ते पर जानवर को न घेरें।','ऐसे फसल-रक्षा उपाय लें जो वन्यजीव को घायल न करें।','कुत्तों को पीछा करने न दें।','लगातार फसल नुकसान अधिकृत माध्यम से रिपोर्ट करें।'],kfy:['सड़क/सांकड़ बाट में जानवर घेरौ नि।','फसल बचाव ऐसो करौ जस स्यूं जानवर घायल नि हो।','कुत्ता पीछो नि करण दिओ।','बार-बार फसल नुकसान अधिकृत माध्यम में रिपोर्ट करौ।']}};let lang=localStorage.getItem('almoraLang')||'en',current='monkey';const tr=k=>T[lang]?.[k]||T.en[k];function render(){document.documentElement.lang=lang;document.querySelector('#title').textContent=tr('title');document.querySelector('#intro').textContent=tr('intro');document.querySelector('#safety').textContent=tr('safety');document.querySelector('#reportTitle').textContent=tr('report');document.querySelector('#reportNote').textContent=tr('reportNote');document.querySelector('#speciesLabel').textContent=tr('species');document.querySelector('#locationLabel').textContent=tr('location');document.querySelector('#detailsLabel').textContent=tr('details');document.querySelector('#save').textContent=tr('save');document.querySelector('#sourcesTitle').textContent=tr('sources');document.querySelector('#legalNote').textContent=tr('legal');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));const tabs=document.querySelector('#tabs');tabs.innerHTML='';const sel=document.querySelector('#speciesSelect');sel.innerHTML='';for(const[id,s]of Object.entries(S)){const b=document.createElement('button');b.textContent=s.name[lang]||s.name.en;b.className=id===current?'active':'';b.onclick=()=>{current=id;render()};tabs.append(b);const o=document.createElement('option');o.value=id;o.textContent=s.name[lang]||s.name.en;sel.append(o)}sel.value=current;const s=S[current];document.querySelector('#card').innerHTML=`<div class="speciesHead"><div class="speciesPic">${s.img?`<img src="${s.img}" alt="AI-generated representative ${s.name.en}">`:s.icon}</div><div><h2>${s.name[lang]||s.name.en}</h2><div class="latin">${s.latin}</div></div></div><div class="facts"><article class="fact"><h3>${lang==='en'?'Biology':lang==='hi'?'जीवविज्ञान':'जीव-विज्ञान'}</h3><p>${s.bio[lang]||s.bio.en}</p></article><article class="fact"><h3>${lang==='en'?'Conflict reduction':lang==='hi'?'संघर्ष कम करना':'टकराव घटाण'}</h3><ul>${(s.avoid[lang]||s.avoid.en).map(x=>`<li>${x}</li>`).join('')}</ul></article><article class="fact"><h3>${lang==='en'?'Legal status':lang==='hi'?'कानूनी स्थिति':'कानूनी स्थिति'}</h3><p>${tr('legal')}</p></article><article class="fact"><h3>${lang==='en'?'When to escalate':lang==='hi'?'कब तुरंत सूचना दें':'कब तुरन्त बतौ'}</h3><p>${lang==='en'?'Injury, attack, trapped animal, repeated livestock loss, bold entry into occupied buildings, or any immediate public danger.':lang==='hi'?'चोट, हमला, फँसा जानवर, बार-बार पशु नुकसान, आबाद भवन में निर्भीक प्रवेश या तत्काल सार्वजनिक खतरा।':'चोट, हमला, फंसल जानवर, बार-बार पशु नुकसान, आबाद घर में घुसण या तुरन्त जन खतरो।'}</p></article></div>`}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('almoraLang',lang);render()});document.querySelector('#reportForm').onsubmit=async e=>{e.preventDefault();const species=S[document.querySelector('#speciesSelect').value];try{await submitTownReport({category:'Monkey / wildlife',location:document.querySelector('#location').value.trim(),description:`${species.name.en}: ${document.querySelector('#details').value.trim()}`});document.querySelector('#status').textContent=tr('saved');e.target.reset()}catch{document.querySelector('#status').textContent=lang==='en'?'Could not save. Please try the main Report / Suggest form.':lang==='hi'?'सेव नहीं हुआ। मुख्य रिपोर्ट / सुझाव फॉर्म आज़माएँ।':'बच नि पायो। मुख्य रिपोर्ट / सुझाव फॉर्म आजमौ।'}};render();</script></body></html>
