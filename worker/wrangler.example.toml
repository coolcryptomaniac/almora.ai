name = "almora-ai-router"
main = "src/index.js"
compatibility_date = "2026-08-11"

# Copy to wrangler.toml only when Cloudflare is intentionally configured.
# Static HTML/assets should remain CDN-cacheable and MUST NOT traverse the Worker by default.

[vars]
ALMORA_ENABLE_AI = "0"
ALLOWED_ORIGINS = "https://almora.ai,https://www.almora.ai"
# Hard application guardrail. Keep deliberately far below the platform's AI allowance.
AI_DAILY_REQUEST_CAP = "120"
AI_RESERVE_REQUESTS = "20"
# AI_MODEL is intentionally omitted until a small model is selected and tested.

# Optional KV bindings. Use ANSWER_KV for reusable AI answers and QUOTA_KV only for coarse quota state.
# Do not write per visitor/pageview: free KV writes are scarce.
# [[kv_namespaces]]
# binding = "ANSWER_KV"
# id = "..."
# [[kv_namespaces]]
# binding = "QUOTA_KV"
# id = "..."

# Optional Workers AI binding. AI remains disabled unless ALMORA_ENABLE_AI=1.
# [ai]
# binding = "AI"

# Third-party provider secrets use `wrangler secret put`; never commit them.
# GROQ_API_KEY
# NVIDIA_API_KEY
# PEXELS_API_KEY
