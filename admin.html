<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b0a"><title>Almora AI Moderator</title><link rel="stylesheet" href="./styles.css"><style>.admin{max-width:1100px;margin:auto;padding:70px 6vw}.adminTop{display:flex;justify-content:space-between;gap:20px;align-items:center}.queue{margin-top:55px}.adminGrid{display:grid;gap:12px;margin-top:22px}.reportCard{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px}.reportCard small{color:var(--muted)}.reportCard .actions{display:flex;gap:8px;margin-top:14px}.reportCard button,.authBox button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.approve{background:var(--lime);color:#071008}.reject{background:#271515;color:#f4c7c7}.authBox{max-width:460px;margin:70px auto;border:1px solid var(--line);background:var(--panel);padding:24px;border-radius:18px}.authBox input{width:100%;margin:8px 0;border:1px solid var(--line);background:#080d0b;color:var(--text);padding:12px;border-radius:10px}.hidden{display:none}</style></head><body><header><a class="brand" href="./"><span>आ</span><b>almora.ai</b></a><nav><a href="./">Public app</a><a href="./jobs.html">Jobs</a><a href="./businesses.html">Businesses</a><button id="logout" class="hidden">Sign out</button></nav></header><main class="admin"><section id="authBox" class="authBox"><span>MODERATOR ACCESS</span><h2>Review Almora submissions</h2><input id="email" type="email" placeholder="Moderator email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button><p id="authStatus"></p></section><section id="console" class="hidden"><div class="adminTop"><div><span>ALMORA CONTROL ROOM</span><h2>Moderation queues</h2><p>Publish only verified, non-sensitive information.</p></div></div><section class="queue"><div class="adminTop"><h3>Resident reports</h3><b id="reportCount">0 pending</b></div><div id="reports" class="adminGrid"></div></section><section class="queue"><div class="adminTop"><h3>Job submissions</h3><b id="jobCount">0 pending</b></div><div id="jobSubmissions" class="adminGrid"></div></section><section class="queue"><div class="adminTop"><h3>Business submissions</h3><b id="businessCount">0 pending</b></div><div id="businessSubmissions" class="adminGrid"></div></section></section></main><script type="module" src="./admin.js"></script></body></html>
