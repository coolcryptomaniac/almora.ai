<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b0a"><title>Almora AI Moderator</title><link rel="stylesheet" href="./styles.css"><style>.admin{max-width:1100px;margin:auto;padding:70px 6vw}.adminTop{display:flex;justify-content:space-between;gap:20px;align-items:center}.adminGrid{display:grid;gap:12px;margin-top:30px}.reportCard{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px}.reportCard small{color:var(--muted)}.reportCard .actions{display:flex;gap:8px;margin-top:14px}.reportCard button,.authBox button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.approve{background:var(--lime);color:#071008}.reject{background:#271515;color:#f4c7c7}.authBox{max-width:460px;margin:70px auto;border:1px solid var(--line);background:var(--panel);padding:24px;border-radius:18px}.authBox input{width:100%;margin:8px 0;border:1px solid var(--line);background:#080d0b;color:var(--text);padding:12px;border-radius:10px}.hidden{display:none}</style></head><body><header><a class="brand" href="./"><span>आ</span><b>almora.ai</b></a><nav><a href="./">Public app</a><button id="logout" class="hidden">Sign out</button></nav></header><main class="admin"><section id="authBox" class="authBox"><span>MODERATOR ACCESS</span><h2>Review Almora reports</h2><input id="email" type="email" placeholder="Moderator email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button><p id="authStatus"></p></section><section id="console" class="hidden"><div class="adminTop"><div><span>MODERATION QUEUE</span><h2>Resident reports</h2><p>Approve only verified, non-sensitive information for the public town map.</p></div><b id="count">0 pending</b></div><div id="reports" class="adminGrid"></div></section></main><script type="module" src="./admin.js"></script></body></html>
