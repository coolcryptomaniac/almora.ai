<!doctype html><html lang="en" data-theme="heritage" data-culture-theme="aipan"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d09"><title>Kumaoni Learning Agent · almora.ai</title><link rel="stylesheet" href="./src/styles/design-system.css?v=6"><link rel="stylesheet" href="./src/styles/aipan.css?v=6"><link rel="stylesheet" href="./src/styles/experience.css?v=2"><style>
.kpage{max-width:1180px;margin:auto;padding:24px 18px 64px}.ktop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.ktop a{text-decoration:none}.langs{display:flex;gap:6px}.langs button,.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 10px}.langs .active,.tabs .active{background:var(--green);color:#08120b}.khero{margin-top:14px;border:1px solid var(--line);border-radius:22px;padding:28px;background:linear-gradient(135deg,#3d160f,#111a1c)}.khero h1{font-size:clamp(40px,7vw,82px);margin:6px 0;line-height:.95}.khero p{color:var(--muted);max-width:780px;line-height:1.6}.search{margin-top:16px;display:flex;gap:7px}.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);padding:12px}.search button{border:0;border-radius:12px;background:var(--green);padding:0 16px;font-weight:800}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.panel{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px}.wordGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.word{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:12px}.word strong{display:block;font-size:22px}.word small{color:var(--muted)}.result{min-height:90px;font-size:15px;line-height:1.6}.litGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lit{border:1px solid var(--line);background:var(--panel2);border-radius:13px;padding:14px}.lit a{color:var(--green)}.note{font-size:10px;color:var(--muted);margin-top:10px}@media(max-width:760px){.kpage{padding:14px 12px 54px}.wordGrid,.litGrid{grid-template-columns:1fr}.khero{padding:20px}.search{flex-direction:column}.search button{height:44px}}
</style></head><body><main class="kpage"><header class="ktop"><a href="./index.html#culture">← <strong>almora.ai</strong></a><div class="langs"><button data-lang="en">EN</button><button data-lang="hi">हिंदी</button><button data-lang="kfy">कुमाऊँनी</button></div></header><section class="khero"><small>KUMAONI LEARNING AGENT</small><h1 id="title">कुमाऊँनी गुरुजी</h1><p id="intro"></p><div class="search"><input id="q" autocomplete="off"><button id="ask">Ask</button></div></section><div class="tabs"><button data-tab="agent" class="active">Agent</button><button data-tab="dictionary">Dictionary</button><button data-tab="phrases">Phrases</button><button data-tab="literature">Literature</button></div><section class="panel" id="panel"></section></main><script>
const C={en:{intro:'A starter learning companion for Kumaoni words, phrases, culture and literature. Kumaoni varies by place and speaker, so community corrections are welcome.',placeholder:'Ask for a word, greeting, phrase or topic…',ask:'Ask',agent:'Learning agent',dictionary:'Dictionary',phrases:'Phrases',literature:'Literature',no:'Try a simple word such as पानी, घर, आज, नमस्कार or ask for greetings.',note:'Starter community dictionary: spellings and usage can vary across Kumaon; this is educational, not an official language authority.'},hi:{intro:'कुमाऊँनी शब्द, वाक्य, संस्कृति और साहित्य के लिए शुरुआती सीखने वाला साथी। अलग क्षेत्रों/बोलने वालों में रूप बदल सकते हैं, इसलिए सामुदायिक सुधार स्वागत योग्य हैं।',placeholder:'कोई शब्द, अभिवादन, वाक्य या विषय पूछें…',ask:'पूछें',agent:'सीखने वाला एजेंट',dictionary:'शब्दकोश',phrases:'वाक्य',literature:'साहित्य',no:'पानी, घर, आज, नमस्कार जैसे सरल शब्द पूछें या अभिवादन माँगें।',note:'यह शुरुआती सामुदायिक शब्दकोश है; कुमाऊँ में वर्तनी/प्रयोग बदल सकते हैं। यह शैक्षिक है, आधिकारिक भाषा प्राधिकरण नहीं।'},kfy:{intro:'कुमाऊँनी शब्द, बोल, संस्कृति अर साहित्य सीखण खातिर शुरुआती साथी। ठौर अर बोलण वाला हिसाब स्यूं रूप बदल सकन, सामुदायिक सुधार स्वागत छ।',placeholder:'कुन शब्द, नमस्कार, बोल या विषय पुछौ…',ask:'पुछौ',agent:'सीखण एजेंट',dictionary:'शब्दकोश',phrases:'बोल',literature:'साहित्य',no:'पाणि, घर, आज, नमस्कार जसो सरल शब्द पुछौ या अभिवादन पुछौ।',note:'यो शुरुआती सामुदायिक शब्दकोश छ; कुमाऊँ में वर्तनी/प्रयोग बदल सकछ। यो पढ़ाई खातिर छ, सरकारी भाषा फैसला नि।'}};
const WORDS=[
{k:'नमस्कार',kfy:'नमस्कार',hi:'नमस्कार',en:'hello / greetings',ex:'नमस्कार, तुम कस छौ?'},
{k:'पाणि',kfy:'पाणि',hi:'पानी',en:'water',ex:'पाणि चहिंछ?'},
{k:'घर',kfy:'घर',hi:'घर',en:'home / house',ex:'मैं घर जांछूं।'},
{k:'आज',kfy:'आज',hi:'आज',en:'today',ex:'आज मौसम ठीक छ।'},
{k:'बाट',kfy:'बाट',hi:'रास्ता',en:'path / way',ex:'यो बाट अल्माड़ जांछ।'},
{k:'ठौर',kfy:'ठौर',hi:'स्थान / जगह',en:'place',ex:'यो सुंदर ठौर छ।'},
{k:'बखत',kfy:'बखत',hi:'समय',en:'time',ex:'कति बखत भै?'},
{k:'कस',kfy:'कस',hi:'कैसे / कैसा',en:'how / what kind',ex:'तुम कस छौ?'},
{k:'छौ',kfy:'छौ',hi:'हो',en:'are',ex:'तुम ठीक छौ।'},
{k:'जांछूं',kfy:'जांछूं',hi:'जाता/जाती हूँ',en:'I go / am going',ex:'मैं बजार जांछूं।'},
{k:'बजार',kfy:'बजार',hi:'बाज़ार',en:'market',ex:'बजार में भीड़ छ।'},
{k:'भल',kfy:'भल',hi:'अच्छा',en:'good',ex:'भल छ।'}];
const PHRASES=[['नमस्कार, तुम कस छौ?','नमस्कार, आप कैसे हैं?','Hello, how are you?'],['मैं भल छूं।','मैं ठीक हूँ।','I am well.'],['यो बाट कख जांछ?','यह रास्ता कहाँ जाता है?','Where does this road go?'],['पाणि कख मिलल?','पानी कहाँ मिलेगा?','Where can I get water?'],['धन्यवाद।','धन्यवाद।','Thank you.']];
let l=localStorage.getItem('almoraLang')||'en',tab='agent';
function txt(k){return(C[l]||C.en)[k]}
function findWord(query){query=query.trim().toLowerCase();return WORDS.find(w=>[w.k,w.kfy,w.hi,w.en].some(v=>String(v).toLowerCase().includes(query)))}
function answer(query){const w=findWord(query);if(w)return `<div class="result"><strong>${w.kfy}</strong><br>${l==='en'?w.en:l==='hi'?w.hi:w.kfy}<br><small>${w.ex}</small></div>`;if(/greet|hello|namaskar|नमस्कार|अभिवादन/i.test(query))return `<div class="result">${PHRASES.slice(0,2).map(p=>`<p><strong>${p[0]}</strong><br><small>${l==='en'?p[2]:p[1]}</small></p>`).join('')}</div>`;return `<div class="result">${txt('no')}</div>`}
function render(){document.documentElement.lang=l;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));intro.textContent=txt('intro');q.placeholder=txt('placeholder');ask.textContent=txt('ask');document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.textContent=txt(b.dataset.tab)});if(tab==='dictionary')panel.innerHTML=`<div class="wordGrid">${WORDS.map(w=>`<article class="word"><strong>${w.kfy}</strong><small>${l==='en'?w.en:w.hi}</small><p>${w.ex}</p></article>`).join('')}</div><p class="note">${txt('note')}</p>`;else if(tab==='phrases')panel.innerHTML=PHRASES.map(p=>`<article class="word"><strong>${p[0]}</strong><small>${l==='en'?p[2]:p[1]}</small></article>`).join('')+`<p class="note">${txt('note')}</p>`;else if(tab==='literature')panel.innerHTML=`<div class="litGrid"><article class="lit"><h3>Kumaoni language</h3><p>${txt('note')}</p><a href="https://en.wikipedia.org/wiki/Kumaoni_language" target="_blank" rel="noopener">Background reference ↗</a></article><article class="lit"><h3>Community literature shelf</h3><p>${l==='en'?'A curated shelf for folk songs, oral histories, poems and public-domain or permission-cleared texts can grow here without copying copyrighted books.':l==='hi'?'लोकगीत, मौखिक इतिहास, कविता और सार्वजनिक-डोमेन/अनुमति प्राप्त पाठों की क्यूरेटेड शेल्फ यहाँ बढ़ सकती है।':'लोकगीत, मौखिक इतिहास, कविता अर अनुमति वाला पाठ यां जोड़ि सकन।'}</p></article></div>`;else panel.innerHTML=answer(q.value||'नमस्कार')}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{l=b.dataset.lang;localStorage.setItem('almoraLang',l);render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});ask.onclick=()=>{tab='agent';render()};q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tab='agent';render()}});render();
</script></body></html>
