<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Almora AI Account</title><link rel="stylesheet" href="./styles.css"></head><body><header><a class="brand" href="./"><span>आ</span><b>almora.ai</b></a><nav><a href="./jobs.html">Jobs</a><a href="./businesses.html">Businesses</a></nav></header><main class="section"><div class="sectionHead"><div><span>RESIDENT ACCOUNT</span><h2>Your Almora profile.</h2><p>Create an account to save a local skills profile and apply for jobs. Keep personal information minimal.</p></div></div><div class="cards"><article id="authCard"><h3>Sign in / create account</h3><input id="email" placeholder="Email" type="email"><input id="password" placeholder="Password (6+ characters)" type="password"><div class="actions"><button id="signin">Sign in</button><button id="signup">Create account</button></div><p id="authStatus"></p></article><article id="profileCard" hidden><h3>Local skills profile</h3><input id="name" placeholder="Display name"><input id="location" placeholder="Area / village"><input id="skills" placeholder="Skills, comma separated"><input id="availability" placeholder="Availability"><textarea id="bio" rows="4" placeholder="Short work summary"></textarea><button id="saveProfile">Save profile</button><button id="logout">Sign out</button><p id="profileStatus"></p></article></div></main><script type="module" src="./account.js"></script></body></html>
