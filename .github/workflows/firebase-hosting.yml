name: Firebase Hosting (Manual)

on:
  workflow_dispatch:

concurrency:
  group: firebase-hosting-manual
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy live manually
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALMORAAI }}
          channelId: live
          projectId: almoraai
