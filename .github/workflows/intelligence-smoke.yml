name: Intelligence Smoke

on:
  pull_request:
    paths:
      - 'agents/**'
      - 'data/**'
      - '.github/workflows/intelligence-smoke.yml'
      - '.github/workflows/town-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refresh people atlas
        run: python3 agents/people_refresh.py
      - name: Refresh live news
        run: python3 agents/news_refresh.py
      - name: Coordinate agents
        run: python3 agents/agent_orchestrator.py
      - name: Build shared evidence memory
        run: python3 agents/learning_loop.py
      - name: Build ranked content feed
        run: python3 agents/content_engine.py
      - name: Validate output quality
        run: |
          python3 - <<'PY'
          import json,re
          people=json.load(open('data/people.json'))
          news=json.load(open('data/live-news.json'))
          agents=json.load(open('data/agent-status.json'))
          learning=json.load(open('data/agent-learning.json'))
          content=json.load(open('data/content-feed.json'))
          routes=json.load(open('data/routes.json'))
          integrations=json.load(open('data/integrations.json'))
          apps=json.load(open('data/apps.json'))
          founder=json.load(open('data/founder.json'))
          assert 12 <= people['count'] <= 200, people['count']
          assert len(people['people']) == people['count']
          names={p['name'] for p in people['people']}
          known_nonpeople={'Afghanistan','Ashoka Chakra','Battle of Tololing','Bedu Pako Baro Masa','Kumaon','Kumaoni language'}
          assert not (names & known_nonpeople), names & known_nonpeople
          auto=[p for p in people['people'] if p.get('id','').startswith('Q')]
          assert auto, 'Expected at least one Wikidata-validated public figure'
          assert all('Wikidata human' in p.get('verification','') or 'Wikidata instance-of human' in p.get('verification','') for p in auto)
          assert all('almora' in (p.get('connection','')+' '+p.get('description','')).lower() for p in people['people'] if p.get('id') != 'mohit-pandey-almora-ai')
          assert 'Hemant Pandey' not in names, 'Regional-only Pithoragarh profile must not enter strict Almora atlas'
          ajay=next((p for p in people['people'] if p['name']=='Ajay Tamta'),None)
          assert ajay, 'Ajay Tamta public-service profile missing'
          assert 'public' in ajay.get('categories',[]) and 'sports' not in ajay.get('categories',[]), ajay
          assert 'polit' in ajay.get('occupation','').lower() or 'public service' in ajay.get('occupation','').lower(), ajay
          mohit=next(p for p in people['people'] if p.get('id')=='mohit-pandey-almora-ai')
          assert {'culture','innovation'} <= set(mohit.get('categories',[])), mohit
          assert 'music' in mohit.get('occupation','').lower(), mohit
          assert founder.get('upiId')=='coolmohit@ybl'
          assert 'github' not in founder, 'Founder public config must not expose GitHub'
          assert len(founder.get('photos',[])) >= 3

          categories={x['category'] for x in news['items']}
          assert len(news['items']) >= 8, len(news['items'])
          assert len(categories) >= 4, categories
          dynamic=[x for x in news['items'] if x.get('categoryBasis')=='headline-keyword']
          assert dynamic, 'Expected category-qualified live stories'
          assert all(x.get('discoveredBy') for x in dynamic)
          checks={
            'jobs':r'job|vacanc|recruit|hiring|employment|apprentice|ssc|psc|रोजगार|भर्ती|नौकरी',
            'education':r'school|college|university|student|education|scholarship|academic|exam|teacher|campus|शिक्षा|विद्यालय|कॉलेज|छात्र|परीक्षा',
            'sports':r'sport|badminton|cricket|football|athlete|tournament|championship|bwf|olymp|stadium|खेल|खिलाड़ी',
            'science':r'science|scientist|laboratory|space|artificial intelligence|\bai\b|scientific|विज्ञान|वैज्ञानिक',
            'innovation':r'innovation|innovator|startup|technology|\btech\b|prototype|skynex|flying car|drone|electric vehicle|incubator|entrepreneurship|नवाचार|स्टार्टअप|तकनीक',
            'infrastructure':r'road|highway|bridge|water supply|transport|rail|railway|airport|infrastructure|construction|landslide|tunnel|sewer|pipeline|सड़क|पुल|रेल|परिवहन',
            'environment':r'monkey|wildlife|forest|climate|environment|leopard|agriculture|farm|waste|water conservation|biodiversity|बंदर|वन्यजीव|जंगल|पर्यावरण|कृषि',
            'politics':r'election|party|congress|bjp|politic|minister|chief minister|cm dhami|cabinet|mla|\bmp\b|rally|चुनाव|भाजपा|कांग्रेस|मंत्री|मुख्यमंत्री',
            'governance':r'government|administration|district magistrate|\bdm\b|policy|scheme|digitisation|digital governance|sop|public notice|tender|सरकार|प्रशासन|नीति|योजना'
          }
          for x in dynamic:
            pat=checks.get(x['category'])
            assert pat and re.search(pat,x['title'],re.I), (x['category'],x['title'])
          bad=('ms dhoni seeks blessings','pause, reflect, reset: is taking a career break')
          learned=json.dumps(learning,ensure_ascii=False).lower()
          assert not any(x in learned for x in bad), 'Agent learning contains query-spillover evidence'

          assert agents['metrics']['agentCount'] >= 20, agents['metrics']
          assert agents['metrics']['collaborationCount'] >= 8, agents['metrics']
          assert learning['mode'] == 'shared-evidence-memory-not-model-training'
          assert learning['count'] >= 4, learning
          assert all(x.get('evidence') for x in learning['lessons'])
          assert all(x.get('expiresAt') for x in learning['lessons'])
          assert content['count'] >= 12, content
          assert len(content.get('agentIndex',{})) >= 8, content.get('agentIndex')
          assert any(x.get('kind')=='news' for x in content['items'])
          assert any(x.get('kind') in {'problem','route','person'} for x in content['items'])
          assert len(routes.get('routes',[])) >= 7
          assert len(integrations.get('integrations',[])) >= 6
          assert len(apps.get('apps',[])) >= 12
          assert any(a.get('id')=='hill-life' and a.get('critical') for a in apps['apps'])
          print({'people':people['count'],'verified_auto':len(auto),'news':len(news['items']),'qualified_live':len(dynamic),'categories':sorted(categories),'agents':agents['metrics'],'learning':learning['count'],'content':content['count'],'routes':len(routes['routes']),'integrations':len(integrations['integrations']),'apps':len(apps['apps'])})
          PY
