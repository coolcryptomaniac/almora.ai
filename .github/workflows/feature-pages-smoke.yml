name: Feature Pages Smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-pages-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/almora-http.log 2>&1 &
          sleep 2
      - name: Validate feature scripts
        run: |
          node --check src/scripts/wildlife-page.js
          node --check src/scripts/kumaoni-page.js
          node --check tests/feature-pages-smoke.mjs
      - name: Run desktop + mobile feature smoke tests
        env:
          TEST_URL: http://127.0.0.1:4173
        run: node tests/feature-pages-smoke.mjs
      - name: Upload feature screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-pages-screenshots
          path: |
            feature-pages-result.json
            feature-wildlife-desktop.png
            feature-wildlife-mobile.png
            feature-kumaoni-desktop.png
            feature-kumaoni-mobile.png
          if-no-files-found: ignore
