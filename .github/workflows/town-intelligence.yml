name: Town Intelligence Refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'data/monkey-hotspots.json'
      - 'data/apps.json'
      - '.github/workflows/town-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: town-intelligence
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message || '', '[data-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh curated news
        run: python3 agents/news_refresh.py
      - name: Refresh people atlas
        run: python3 agents/people_refresh.py
      - name: Coordinate agents
        run: python3 agents/agent_orchestrator.py
      - name: Build shared evidence memory
        run: python3 agents/learning_loop.py
      - name: Build ranked content feed
        run: python3 agents/content_engine.py
      - name: Validate generated JSON
        run: |
          python3 -m json.tool data/live-news.json >/dev/null
          python3 -m json.tool data/people.json >/dev/null
          python3 -m json.tool data/monkey-hotspots.json >/dev/null
          python3 -m json.tool data/agent-status.json >/dev/null
          python3 -m json.tool data/agent-learning.json >/dev/null
          python3 -m json.tool data/content-feed.json >/dev/null
      - name: Commit refreshed public intelligence
        id: data_commit
        run: |
          git config user.name 'almora-ai-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live-news.json data/people.json data/agent-status.json data/agent-learning.json data/content-feed.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No public intelligence changes.'
          else
            git commit -m 'data: refresh town intelligence [data-refresh]'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy refreshed intelligence to Firebase Hosting
        if: steps.data_commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ALMORAAI }}
          channelId: live
          projectId: almoraai
