name: Town Intelligence Refresh (Monthly)

on:
  schedule:
    - cron: '17 2 4 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: town-intelligence-monthly
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh curated news
        run: python3 agents/news_refresh.py
      - name: Refresh people atlas
        run: python3 agents/people_refresh.py
      - name: Coordinate agents
        run: python3 agents/agent_orchestrator.py
      - name: Build shared evidence memory
        run: python3 agents/learning_loop.py
      - name: Build ranked content feed
        run: python3 agents/content_engine.py
      - name: Validate generated JSON
        run: |
          python3 -m json.tool data/live-news.json >/dev/null
          python3 -m json.tool data/people.json >/dev/null
          python3 -m json.tool data/monkey-hotspots.json >/dev/null
          python3 -m json.tool data/agent-status.json >/dev/null
          python3 -m json.tool data/agent-learning.json >/dev/null
          python3 -m json.tool data/content-feed.json >/dev/null
      - name: Commit refreshed public intelligence
        run: |
          git config user.name 'almora-ai-agent'
          git config user.email 'actions@users.noreply.github.com'
          git add data/live-news.json data/people.json data/agent-status.json data/agent-learning.json data/content-feed.json
          git diff --cached --quiet || git commit -m 'data: monthly town intelligence refresh'
          git push
