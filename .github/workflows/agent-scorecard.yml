name: Agent scorecard
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate scorecard
        run: python3 agents/scorecard.py
      - name: Commit scorecard when changed
        run: |
          git config user.name "almora-ai-agent"
          git config user.email "actions@users.noreply.github.com"
          git add data/agent-status.json
          git diff --cached --quiet || git commit -m "chore: refresh agent scorecard"
          git push
